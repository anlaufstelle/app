# Konfigurationspaket „Beratungsstelle“ (Schema v1) — Refs #2145.
#
# WICHTIG — Kompatibilitaet mit Bestands-Einrichtungen:
#
# * ``document_types[].slug`` ist der Lookup-Key des Loaders und muss EXAKT
#   dem Ergebnis des Slug-Backfills aus Migration ``0117`` entsprechen
#   (slugify + Umlaut-Map ueber den ``name``). Ein abweichender Slug legt in
#   jeder Bestands-Einrichtung einen DUPLIKAT-Typ an, statt den vorhandenen
#   zu aktualisieren. Dasselbe gilt fuer ``groups[].slug`` (stabile Slugs
#   seit #1710) und ``field_templates[].slug``.
# * ``system_type`` muss bei allen Typen mitgefuehrt werden, die einen haben:
#   der Loader erlaubt ``None`` -> Wert (Bestand ohne Systemtyp), aber weder
#   Wechsel noch Entfernen (E13). Ein fehlender Schluessel waere beim
#   Re-Lauf gegen eine gepflegte Einrichtung ein Fehler. Seit E4 (Refs #1850)
#   sind das nur noch ``krisengespraech`` (``crisis``) und ``hausverbot``
#   (``ban``) — die uebrigen sieben Werte sind aus dem Enum entfernt, ihre
#   Zeilen hier entfallen ersatzlos. Gegen einen Bestand, den Migration
#   ``0147`` bereits genullt hat, ist das kein E13-Konflikt (leer bleibt
#   leer); ein aelteres Paket, das sie noch mitfuehrt, laedt weiterhin — der
#   Wert entfaellt dann mit einer Warnung im Load-Report.
# * ``report_key`` (E3, Refs #1849) muss EXAKT dem Ergebnis des Backfills aus
#   Migration ``0145`` entsprechen — Typ-Ebene wie Feld-Ebene. Ein abweichender
#   Wert waere gegen eine aktualisierte Bestands-Einrichtung ein
#   Immutabilitaets-Fehler (leer -> gesetzt ist erlaubt, gesetzt -> anders
#   nicht). Der Doppellauf-Test in ``test_packages_loader.py`` haelt das fest.
# * Bei ``select``/``multi_select`` ist der ``options``-Schluessel PFLICHT —
#   Weglassen leert ``options_json`` mit blosser Warnung.
# * KEINE ``conditions``-Schluessel: der Seed bringt keine Feldbedingungen
#   mit, und ein fehlender Schluessel laesst per UI gepflegte Bedingungen
#   unangetastet (E14/M1-E20). ``conditions: []`` wuerde sie LOESCHEN.
#
# ``sort_order`` folgt der globalen Block-Sequenz (ADR-036/#1713): Gruppen
# und ungruppierte Felder teilen sich EINE Sequenz je Dokumentationstyp;
# ein Feld INNERHALB einer Gruppe traegt seinen Innen-Index 0..n-1.

schema_version: 1

field_templates:
  - slug: dauer
    name: Dauer
    report_key: dauer_minuten
    field_type: number
    is_encrypted: false
    sensitivity: ""
    help_text: Dauer in Minuten

  - slug: notiz
    name: Notiz
    field_type: textarea
    is_encrypted: false
    sensitivity: ""
    help_text: Keine Adressen, Klarnamen oder Verfahrensdaten eintragen — Pseudonyme wie in der übrigen Dokumentation verwenden.

  - slug: leistungen
    name: Leistungen
    report_key: leistungen
    field_type: multi_select
    is_encrypted: false
    sensitivity: ""
    options:
      - {slug: information, label: Information, is_active: true}
      - {slug: formularhilfe, label: Formularhilfe, is_active: true}
      - {slug: telefonat-fuer-klientin, label: Telefonat für die Person, is_active: true}
      - {slug: weiterverweis, label: Weiterverweis, is_active: true}
      - {slug: wartebereich, label: Wartebereich, is_active: true}
      - {slug: sonstiges, label: Sonstiges, is_active: true}

  - slug: alterscluster
    name: Altersgruppe
    field_type: select
    is_encrypted: false
    sensitivity: ""
    help_text: Geschätztes Alter
    options:
      - {slug: u18, label: "U18", is_active: true}
      - {slug: "18-26", label: "18-26", is_active: true}
      - {slug: "27-plus", label: "27+", is_active: true}
      - {slug: unbekannt, label: Unbekannt, is_active: true}

  - slug: thema-kurz
    name: Thema (Kurzberatung)
    field_type: select
    is_encrypted: false
    sensitivity: ""
    options:
      - {slug: wohnen, label: Wohnen, is_active: true}
      - {slug: geld-schulden, label: Geld & Schulden, is_active: true}
      - {slug: arbeit, label: Arbeit, is_active: true}
      - {slug: gesundheit, label: Gesundheit, is_active: true}
      - {slug: familie-beziehung, label: Familie & Beziehung, is_active: true}
      - {slug: behoerden-antraege, label: Behörden & Anträge, is_active: true}
      - {slug: aufenthalt, label: Aufenthalt, is_active: true}
      - {slug: sonstiges, label: Sonstiges, is_active: true}

  - slug: weiterverweis
    name: Weiterverweis
    field_type: select
    is_encrypted: false
    sensitivity: ""
    options:
      - {slug: interne-beratung, label: Interne Beratung, is_active: true}
      - {slug: fachstelle, label: Fachstelle, is_active: true}
      - {slug: behoerde, label: Behörde, is_active: true}
      - {slug: keine, label: Keine, is_active: true}

  - slug: art-der-krise
    name: Art der Krise
    report_key: art_der_krise
    field_type: select
    is_encrypted: false
    sensitivity: ""
    options:
      - {slug: akute-belastung, label: Akute Belastung, is_active: true}
      - {slug: suizidal, label: Suizidal, is_active: true}
      - {slug: gewalt, label: Gewalt, is_active: true}
      - {slug: wohnungsverlust, label: Wohnungsverlust, is_active: true}
      - {slug: finanzielle-notlage, label: Finanzielle Notlage, is_active: true}
      - {slug: psychische-krise, label: Psychische Krise, is_active: true}
      - {slug: sonstiges, label: Sonstiges, is_active: true}

  - slug: notiz-krise
    name: Notiz (Krise)
    field_type: textarea
    is_encrypted: true
    sensitivity: high

  - slug: weitervermittlung
    name: Weitervermittlung
    field_type: text
    is_encrypted: false
    sensitivity: ""

  - slug: ziel
    name: Ziel
    field_type: text
    is_required: true
    is_encrypted: false
    sensitivity: ""
    help_text: Keine Adressen, Klarnamen oder Verfahrensdaten eintragen — Pseudonyme wie in der übrigen Dokumentation verwenden.

  - slug: datum
    name: Datum
    field_type: date
    is_encrypted: false
    sensitivity: ""

  - slug: uhrzeit
    name: Uhrzeit
    field_type: time
    is_encrypted: false
    sensitivity: ""

  - slug: notiz-begleitung
    name: Notiz (Begleitung)
    field_type: textarea
    is_encrypted: true
    sensitivity: high

  - slug: thema
    name: Thema
    field_type: text
    is_encrypted: true
    sensitivity: high

  - slug: vereinbarungen
    name: Vereinbarungen
    field_type: textarea
    is_encrypted: true
    sensitivity: high

  - slug: naechster-termin
    name: Nächster Termin
    field_type: date
    is_encrypted: false
    sensitivity: ""

  - slug: scan-bescheid
    name: Scan/Bescheid
    field_type: file
    is_required: false
    is_encrypted: true
    sensitivity: high

  - slug: grund
    name: Grund
    field_type: textarea
    is_required: true
    is_encrypted: false
    sensitivity: ""

  - slug: bis
    name: Bis
    field_type: date
    is_encrypted: false
    sensitivity: ""

  - slug: aktiv
    name: Aktiv
    field_type: boolean
    is_encrypted: false
    sensitivity: ""

document_types:
  - slug: kontakt
    name: Kontakt (Sprechstunde)
    entity_type: event
    tally_enabled: true
    report_key: contact
    sensitivity: normal
    icon: users
    color: indigo
    sort_order: 0
    field_refs:
      - {template_slug: dauer, sort_order: 0}
      - {template_slug: alterscluster, sort_order: 1}
      - {template_slug: leistungen, sort_order: 2}
      - {template_slug: notiz, sort_order: 3}

  - slug: kurzberatung
    name: Kurzberatung (anonym)
    entity_type: event
    tally_enabled: true
    report_key: counseling
    sensitivity: normal
    icon: message-circle
    color: purple
    sort_order: 1
    field_refs:
      - {template_slug: thema-kurz, sort_order: 0}
      - {template_slug: dauer, sort_order: 1}
      - {template_slug: weiterverweis, sort_order: 2}

  - slug: beratungsgespraech
    name: Beratungsgespräch
    entity_type: event
    report_key: counseling
    sensitivity: elevated
    min_contact_stage: identified
    icon: message-circle
    color: purple
    sort_order: 2
    field_refs:
      - {template_slug: thema, sort_order: 0}
      - {template_slug: dauer, sort_order: 1}
      - {template_slug: vereinbarungen, sort_order: 2}
      - {template_slug: naechster-termin, sort_order: 3}
      - {template_slug: scan-bescheid, sort_order: 4}

  - slug: krisengespraech
    name: Krisengespräch
    entity_type: event
    system_type: crisis
    report_key: crisis
    sensitivity: elevated
    icon: alert-triangle
    color: amber
    sort_order: 3
    field_refs:
      - {template_slug: art-der-krise, sort_order: 0}
      - {template_slug: dauer, sort_order: 1}
      - {template_slug: notiz-krise, sort_order: 2}
      - {template_slug: weitervermittlung, sort_order: 3}

  - slug: begleitung
    name: Begleitung
    entity_type: event
    report_key: accompaniment
    sensitivity: normal
    min_contact_stage: identified
    icon: map-pin
    color: green
    sort_order: 4
    field_refs:
      - {template_slug: ziel, sort_order: 0}
      - {template_slug: datum, sort_order: 1}
      - {template_slug: uhrzeit, sort_order: 2}
      - {template_slug: notiz-begleitung, sort_order: 3}

  - slug: vermittlung
    name: Vermittlung
    entity_type: event
    tally_enabled: true
    report_key: referral
    sensitivity: normal
    icon: share-2
    color: blue
    sort_order: 5

  - slug: notiz
    name: Notiz
    entity_type: event
    tally_enabled: true
    report_key: excluded
    sensitivity: normal
    icon: file-text
    color: gray
    sort_order: 6
    field_refs:
      - {template_slug: notiz, sort_order: 0}

  - slug: hausverbot
    name: Hausverbot
    entity_type: event
    system_type: ban
    report_key: excluded
    sensitivity: elevated
    icon: slash
    color: red
    sort_order: 7
    field_refs:
      - {template_slug: grund, sort_order: 0}
      - {template_slug: bis, sort_order: 1}
      - {template_slug: aktiv, sort_order: 2}
