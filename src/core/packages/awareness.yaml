      - {template_slug: folgesituation, sort_order: 4}
      - {template_slug: notiz-vorfall, sort_order: 5}

  - slug: krisensituation
    name: Krisensituation
    entity_type: event
    system_type: crisis
    tally_enabled: false
    report_key: crisis
    sensitivity: elevated
    icon: alert-triangle
    color: amber
    sort_order: 3
    field_refs:
      - {template_slug: art-der-krise, sort_order: 0}
      - {template_slug: notiz-krise, sort_order: 1}
      - {template_slug: weitervermittlung, sort_order: 2}

  - slug: orga-meldung
    name: Orga-Meldung (Platzverweis)
    entity_type: event
    system_type: ban
    tally_enabled: false
    report_key: excluded
    sensitivity: elevated
    icon: slash
    color: red
    sort_order: 4
    field_refs:
      - {template_slug: grund, sort_order: 0}
      - {template_slug: bis, sort_order: 1}
      - {template_slug: aktiv, sort_order: 2}

  - slug: vermittlung
    name: Vermittlung
    entity_type: event
    tally_enabled: true
    report_key: referral
    sensitivity: normal
    icon: share-2
    color: blue
    sort_order: 5
    field_refs:
      - {template_slug: vermittelt-an, sort_order: 0}
      - {template_slug: veranstaltung, sort_order: 1}

  - slug: notiz
