    name: Awareness-Kontakt
    entity_type: event
    tally_enabled: true
    report_key: contact
    sensitivity: normal
    icon: users
    color: indigo
    sort_order: 0
    field_refs:
      - {template_slug: anliegen, sort_order: 0}
      - {template_slug: alterscluster, sort_order: 1}
      - {template_slug: dauer, sort_order: 2}
      - {template_slug: veranstaltung, sort_order: 3}

  - slug: versorgung
    name: Versorgung
    entity_type: event
    tally_enabled: true
    report_key: supply
    sensitivity: normal
    icon: heart
    color: rose
    sort_order: 1
    field_refs:
      - {template_slug: bedarf, sort_order: 0}
      - {template_slug: veranstaltung, sort_order: 1}

  - slug: gewaltvorfall
    name: Gewaltvorfall
    entity_type: event
    tally_enabled: false
    report_key: incident
    sensitivity: elevated
    icon: alert-triangle
    color: red
    sort_order: 2
    field_refs:
      - {template_slug: art-des-vorfalls, sort_order: 0}
      - {template_slug: beteiligung, sort_order: 1}
      - {template_slug: ort-im-veranstaltungsgelaende, sort_order: 2}
