{% load i18n %}
<div id="tally-action-{{ row.document_type.pk }}" class="flex items-center flex-shrink-0"
     data-testid="tally-action-{{ row.document_type.pk }}">
    {% if row.requires_number_input %}
    <a href="{{ row.tally_increment_url }}"
       class="inline-flex items-center justify-center min-h-[36px] min-w-[36px] px-3 rounded-[10px] btn-secondary font-bold"
       data-testid="tally-increment-{{ row.document_type.pk }}"
       hx-get="{{ row.tally_increment_url }}"
       hx-target="#tally-action-{{ row.document_type.pk }}"
       hx-swap="outerHTML"
       aria-label="{% blocktrans with name=row.document_type.name %}Werte für {{ name }} eingeben{% endblocktrans %}">+1</a>
    {% else %}
    <form method="post" action="{% url 'core:tally_increment' %}"
          hx-post="{% url 'core:tally_increment' %}"
          hx-target="#tally-row-{{ row.document_type.pk }}"
          hx-headers='{"X-Idempotency-Key": "{{ row.idempotency_key }}"}'
          hx-swap="outerHTML">
        {% csrf_token %}
        <input type="hidden" name="document_type" value="{{ row.document_type.pk }}">
        <input type="hidden" name="idempotency_key" value="{{ row.idempotency_key }}">
        <input type="hidden" name="next" value="{{ tally_next }}">
        {% for name, value in tally_filter_state.items %}
        <input type="hidden" name="{{ name }}" value="{{ value }}">
        {% endfor %}
    <button
            class="inline-flex items-center justify-center min-h-[36px] min-w-[36px] px-3 rounded-[10px] btn-secondary font-bold"
            data-testid="tally-increment-{{ row.document_type.pk }}"
            type="submit"
            aria-label="{% blocktrans with name=row.document_type.name %}Anonymen Kontakt für {{ name }} zählen{% endblocktrans %}">
        +1
    </button>
    </form>
    {% endif %}
</div>
