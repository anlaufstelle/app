{% load i18n %}
<div id="zeitstrom-current-shift-slot">
    {% if current_shift_summary %}
    <section class="mb-5 bg-surface border border-subtle rounded-[10px] overflow-hidden" data-testid="current-shift" aria-labelledby="current-shift-heading">
        <div class="px-4 py-3 flex items-center gap-3 flex-wrap border-b border-subtle">
            <svg aria-hidden="true" class="w-4 h-4 text-ink-muted flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
            <div>
                <h2 id="current-shift-heading" class="text-[11px] font-bold text-ink-muted uppercase tracking-wider leading-none">{% trans "Aktueller Dienst" %}</h2>
                <span class="text-[13px] font-semibold text-ink-soft" data-testid="current-shift-label">{{ current_shift_summary.shift_label }} · {{ current_shift_summary.shift_range }}</span>
            </div>
        </div>
        <div class="px-4 pb-4 pt-3">
            {% include "core/handover/partials/_summary_compact.html" with handover_summary=current_shift_summary %}
        </div>
    </section>
    {% endif %}
</div>
