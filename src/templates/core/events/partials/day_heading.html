{% load i18n %}
{% translate "D, j. M" as day_format %}
<h2 data-event-day="{{ group.day|date:'Y-m-d' }}" class="bg-surface-alt px-3.5 py-2 text-[13px] font-semibold text-ink">
    {{ group.day|date:day_format }} — {% blocktranslate count count=group.count %}{{ count }} Kontakt{% plural %}{{ count }} Kontakte{% endblocktranslate %}
</h2>
