{% load i18n core_tags %}
<div class="feed-row" x-data="expandableCard" {% if not ignore_global_collapse %}x-init="applyGlobalCollapse" @zeitstrom-collapse-all.window="applyGlobalCollapse"{% endif %}>
    <button type="button" @click="toggle" aria-expanded="false" :aria-expanded="expanded"
            aria-controls="event-detail-{{ event.pk }}" data-testid="event-card-toggle" class="feed-row-header">
        <span data-feed-column="edge" class="feed-row-edge bg-event" aria-hidden="true"></span>
        <span data-feed-column="time" class="feed-row-time" title="{{ event.occurred_at|date:'DATETIME_FORMAT' }}">
            {{ event.occurred_at|time:"H:i" }}{% if show_date %}<span class="block text-[11px]">{{ event.occurred_at|date:"d.m.y" }}</span>{% endif %}
        </span>
        <span data-feed-column="type" class="feed-row-type">{{ event.document_type.name }}</span>
        <span data-feed-column="person" class="feed-row-person">
            {% if show_client %}{% if event.is_anonymous %}<span class="text-ink-muted italic">{% trans "Anonym" %}</span>{% elif event.client %}{{ event.client.pseudonym }}{% endif %}{% endif %}
        </span>
        <span data-feed-column="details" class="feed-row-details">
            {% if show_case and event.case and not event.case.is_deleted %}<span>{% trans "Fall" %}: {{ event.case.title }} · </span>{% endif %}
            {% for pf in event.preview_fields %}<span>{{ pf.label }}: {{ pf.value }}{% if not forloop.last %} · {% endif %}</span>{% endfor %}
        </span>
        <span data-feed-column="by" class="feed-row-by">
            {% if event.created_by %}<span class="truncate">{{ event.created_by.display_name|default:event.created_by.username }}</span>{% endif %}
            <span class="inline-flex text-ink-muted transition-transform duration-200" :class="rotateClass" aria-hidden="true"><svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg></span>
        </span>
    </button>
        <div id="event-detail-{{ event.pk }}" x-show="expanded" x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 -translate-y-1" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 -translate-y-1" x-cloak>
            <div class="mx-3.5 mb-3 mt-1 bg-canvas rounded-md px-3 py-2 text-[13px] text-ink-soft space-y-1">
                {% if event.expanded_fields %}
                    {% for f in event.expanded_fields %}
                    <div>
                        <span class="font-semibold text-ink">{{ f.label }}:</span>
                        {% if f.is_textarea %}
                        <div class="mt-1 whitespace-pre-line">{{ f.value }}</div>
                        {% else %}
                        {{ f.value }}
                        {% endif %}
                    </div>
                    {% endfor %}
                {% else %}
                    <div class="italic text-ink-muted">{% trans "Keine weiteren Angaben." %}</div>
                {% endif %}
                <div class="pt-1">
                    <a href="{% url 'core:event_detail' event.pk %}" class="inline-flex items-center text-[13px] text-accent hover:underline font-semibold">
                        {% trans "Zum Eintrag" %}
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 ml-1" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 10a.75.75 0 01.75-.75h10.638L10.23 5.29a.75.75 0 111.04-1.08l5.5 5.25a.75.75 0 010 1.08l-5.5 5.25a.75.75 0 11-1.04-1.08l4.158-3.96H3.75A.75.75 0 013 10z" clip-rule="evenodd" />
                        </svg>
                    </a>
                </div>
            </div>
        </div>
</div>
