{% load i18n %}

{% if messages %}
<div class="mb-4 space-y-2">
    {% for message in messages %}
    <div class="p-3 rounded-md text-sm {% if 'success' in message.tags %}bg-green-100 text-green-800{% elif message.tags == 'error' %}bg-red-100 text-red-800{% elif message.tags == 'warning' %}bg-yellow-100 text-yellow-800{% else %}bg-blue-100 text-blue-800{% endif %}" role="alert"{% if "autosave-confirmed:" in message.extra_tags %} data-autosave-confirmed="{{ message.extra_tags }}"{% endif %}>
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
