{% load i18n %}
{% get_current_language as current_language %}
<form method="post" action="{% url 'set_language' %}" class="flex justify-end gap-2 mb-4" aria-label="{% trans 'Sprache' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" name="language" value="de" aria-pressed="{% if current_language == 'de' %}true{% else %}false{% endif %}" lang="de" class="min-h-[44px] min-w-[44px] px-3 py-2 rounded-md border border-subtle {% if current_language == 'de' %}bg-accent text-white{% else %}text-ink{% endif %} focus:ring-2 focus:ring-accent">DE</button>
    <button type="submit" name="language" value="en" aria-pressed="{% if current_language == 'en' %}true{% else %}false{% endif %}" lang="en" class="min-h-[44px] min-w-[44px] px-3 py-2 rounded-md border border-subtle {% if current_language == 'en' %}bg-accent text-white{% else %}text-ink{% endif %} focus:ring-2 focus:ring-accent">EN</button>
</form>
