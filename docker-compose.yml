# Lokale Entwicklungs-Compose — niemals auf einem oeffentlichen Server starten.
#
# ``docker compose up`` ohne weitere Flags genuegt: der einmalige ``init``-Dienst
# migriert das Schema und legt Demo-Daten an, solange die Datenbank noch leer ist
# (Refs #1062, ADR-049). Danach steht http://localhost:8000/login/ mit den
# Seed-Zugaengen bereit.
#
# Diese Datei nutzt triviale Default-Credentials (anlaufstelle/anlaufstelle/anlaufstelle)
# und legt beim ersten Start Demo-Konten mit dokumentiertem Passwort an. Postgres und
# Webdienst sind deshalb explizit auf 127.0.0.1 gebunden, sonst wuerde
# ``docker compose up`` auf 0.0.0.0 lauschen und Datenbank wie Anwendung mit
# bekannten Zugangsdaten aus dem Internet erreichbar machen (Refs #799/#1062).
#
# Fuer den produktiven Einsatz bitte ``docker-compose.prod.yml`` verwenden — dort
# gibt es weder Auto-Seed noch ``SEED_ALLOWED``; die Ersteinrichtung laeuft ueber
# ``manage.py create_super_admin`` (docs/admin-guide.md § 1).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

name: anlaufstelle-dev

services:
  db:
    logging: *default-logging
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: anlaufstelle
      POSTGRES_USER: anlaufstelle
      POSTGRES_PASSWORD: anlaufstelle
    ports:
      # Loopback-Binding — DB ist nur lokal erreichbar (Refs #799).
      - "127.0.0.1:5432:5432"
    volumes:
      # PG18-Image: PGDATA liegt unter /var/lib/postgresql/18/docker, das Image
      # deklariert VOLUME /var/lib/postgresql. Mount aufs Elternverzeichnis —
      # ein Mount auf .../data (PG16-Layout) liefe ins Leere und die Daten
      # landeten in einem anonymen Volume. Refs #1039.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anlaufstelle"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Einmaliger Bootstrap des lokalen Setups (Refs #1062, ADR-049): Schema
  # migrieren, danach Demo-Daten anlegen -- Letzteres nur, wenn die Datenbank
  # noch kein Benutzerkonto hat. Der Dienst beendet sich; ``web`` startet erst
  # danach. Es gibt ihn AUSSCHLIESSLICH hier: die Produktions-/Staging-/dev-/
  # Demo-Stacks migrieren weiterhin ueber den getrennten One-Shot-Job
  # ``docker-migrate.sh`` und seeden nie automatisch.
  init:
    logging: *default-logging
    build: .
    # Gemeinsames Tag mit ``web``: derselbe Build-Kontext, dasselbe Image —
    # ohne ``image:`` legte Compose zwei getrennte Tags an und baute zweimal.
    image: anlaufstelle-local:latest
    # Wie bei ``web``: ./src:/app verdeckt den Image-Entrypoint (Refs #1977).
    entrypoint: []
    command: ["/bin/sh", "/opt/anlaufstelle/bin/bootstrap.sh", "bootstrap"]
    restart: "no"
    volumes:
      - ./src:/app
      # Das Bootstrap-Skript liegt bewusst NICHT im Image: es ist reines
      # Local-Onboarding und hat im Produktions-Artefakt nichts verloren.
      - ./scripts/local/bootstrap.sh:/opt/anlaufstelle/bin/bootstrap.sh:ro
      - localstate:/home/appuser
    environment:
      DJANGO_SETTINGS_MODULE: anlaufstelle.settings.dev
      POSTGRES_HOST: db
      POSTGRES_DB: anlaufstelle
      POSTGRES_USER: anlaufstelle
      POSTGRES_PASSWORD: anlaufstelle
      # Leer lassen ist der Normalfall: das Bootstrap-Skript erzeugt beim
      # allerersten Start einen zufaelligen Schluessel in ``localstate``.
      # Ein gesetzter Wert gewinnt (Refs #1977: kein ausgeliefertes
      # Fest-Geheimnis, aber auch kein Setup-Schritt vor dem ersten Start).
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      # Der PFAD, nicht der Wert: ``settings/dev.py`` liest die Datei. Ein nur
      # in die Startshell exportierter Schluessel waere fuer
      # ``docker compose exec/run python manage.py …`` unsichtbar — diese
      # Prozesse erben die Container-Konfiguration, nicht die Umgebung von
      # PID 1, und liefen still im Klartext-Modus (Refs #1062).
      LOCAL_ENCRYPTION_KEY_FILE: /home/appuser/encryption.key
    depends_on:
      db:
        condition: service_healthy

  web:
    logging: *default-logging
    build: .
    image: anlaufstelle-local:latest
    # ./src:/app verdeckt den Image-Entrypoint. Dev startet deshalb bewusst
    # ohne ihn und kopiert zuerst das im Image gebaute CSS aus dem nicht
    # gemounteten Pfad in den Quellbaum (Refs #1977).
    #
    # ``ensure-key`` legt die Schluesseldatei an, falls sie fehlt, und
    # exportiert bewusst NICHTS: gelesen wird sie von ``settings/dev.py`` ueber
    # ``LOCAL_ENCRYPTION_KEY_FILE``. Nur so sieht auch jedes spaetere
    # ``docker compose exec/run python manage.py …`` denselben Schluessel
    # (Refs #1062).
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        cp /opt/anlaufstelle/static/css/styles.css /app/static/css/styles.css
        /bin/sh /opt/anlaufstelle/bin/bootstrap.sh ensure-key
        exec python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/app
      - ./scripts/local/bootstrap.sh:/opt/anlaufstelle/bin/bootstrap.sh:ro
      - localstate:/home/appuser
    ports:
      # Loopback-Binding — die Anwendung faehrt mit bekannten Seed-Zugaengen
      # hoch und darf darum nicht auf 0.0.0.0 lauschen (Refs #799/#1062).
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: anlaufstelle.settings.dev
      POSTGRES_HOST: db
      POSTGRES_DB: anlaufstelle
      POSTGRES_USER: anlaufstelle
      POSTGRES_PASSWORD: anlaufstelle
      # Siehe ``init``: leer heisst "Schluessel aus ``localstate`` nehmen".
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      LOCAL_ENCRYPTION_KEY_FILE: /home/appuser/encryption.key
      SUPPORT_CONTACT: ${SUPPORT_CONTACT-}
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    # Das Dev-Postgres initialisiert POSTGRES_USER als Bootstrap-Superuser.
    # /health/ meldet den erwarteten RLS-Bypass deshalb als "degraded"; fuer
    # den lokalen Stack pruefen wir reine Liveness. Das Image und die
    # Produktions-Compose behalten ihren strengen status=ok-Check (Refs #1982).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=5).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  tailwind:
    logging: *default-logging
    image: node:26-alpine@sha256:233761595746769ebfdb6090f44fc7cdf818ae0ce62d2b37e0367723b9823e36
    working_dir: /app
    volumes:
      - .:/app
    command: npx @tailwindcss/cli -i src/static/css/input.css -o src/static/css/styles.css --watch
    profiles:
      - tailwind

  clamav:
    logging: *default-logging
    image: clamav/clamav:stable@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    # Opt-in per Profil (Refs #1062): ``CLAMAV_ENABLED`` ist im lokalen
    # web-Dienst ungesetzt, der Scanner also ohnehin unbenutzt. Als
    # profilloser Dienst lud ``docker compose up`` trotzdem ein ~1-GB-Image
    # samt Signatur-Update — auf einem frischen Klon der mit Abstand
    # groesste Posten am 60-Sekunden-Versprechen. Start bei Bedarf:
    # ``docker compose --profile clamav up clamav``.
    profiles:
      - clamav
    volumes:
      - clamav-db:/var/lib/clamav
    # Port 3310 ist nur innerhalb des Compose-Netzwerks sichtbar — kein Host-Binding.
    # Aktivierung via CLAMAV_ENABLED=true im web-Container.
    # Refs #938: Healthcheck via clamdscan --version (Smoke-Test des Binary).
    # Der frühere clamdcheck.sh testet TCP 3310, aber clamd lauscht im
    # Image-Default nicht auf TCP — führte zu permanent unhealthy-Status,
    # obwohl clamd grundsätzlich funktioniert.
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  pgdata:
  clamav-db:
  # Home des Container-Benutzers. Traegt den lokal erzeugten Fernet-Schluessel
  # (``encryption.key``, Mode 0600) ueber Neustarts hinweg — ohne ihn waeren
  # bereits verschluesselte Entwicklungsdaten nach dem naechsten ``up`` nicht
  # mehr lesbar. Das Image legt /home/appuser als appuser-owned an, das
  # Volume erbt diese Rechte beim ersten Mount (Refs #1062).
  localstate:
