name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-e2e:
    # Der Job-Name traegt die Scheibennummer, damit ein roter Lauf ohne Blick
    # ins Log sagt, welcher Teil der Suite gefallen ist.
    name: E2E-Scheibe ${{ matrix.slice }}
    runs-on: ubuntu-24.04  # Moving label switches to Ubuntu 26 on 2026-10-19; upgrade deliberately after v0.99.8.
    strategy:
      # Kein fail-fast: eine rote Scheibe soll die anderen nicht abwuergen --
      # sonst kostet jeder Fehlschlag eine weitere Runde, um zu sehen, ob die
      # uebrigen Scheiben ebenfalls betroffen sind.
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Muss zur Laenge der ``slice``-Liste oben passen; der erste Step prueft
      # das gegen ``strategy.job-total``. Eine stille Abweichung waere der
      # gefaehrlichste Fehler dieses Workflows: bei E2E_SLICES > Matrix-Laenge
      # liefe die CI gruen, ohne den Rest der Suite je auszufuehren.
      E2E_SLICES: 8
    # Each slice runs serially (no -n, see the pytest step below). Sizing
    # (Refs #1976): the suite has 1,111 test functions, cut by test count.
    # Measured on Stage with four slices: ~6 min setup per job (checkout,
    # deps, browser, Tailwind, collectstatic) and ~104 min pytest in total;
    # three of four slices were cancelled at the 30 min limit (slowest slice
    # > 30 min). With eight slices a job is expected to take ~25 min, i.e. about
    # 62 % of 40 min; the target is <= 80 % of the limit. --timeout=120 per
    # test remains the first line of defence against hangs.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: anlaufstelle
          POSTGRES_USER: anlaufstelle
          POSTGRES_PASSWORD: anlaufstelle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anlaufstelle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Scheibenzahl gegen die Matrix pruefen
        run: |
          set -euo pipefail
          if [ "${{ strategy.job-total }}" != "$E2E_SLICES" ]; then
            echo "Matrix hat ${{ strategy.job-total }} Jobs, E2E_SLICES=$E2E_SLICES." >&2
            echo "Der Schnitt wuerde Testdateien auslassen oder Indizes ins Leere zeigen." >&2
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      # libharfbuzz-subset0: WeasyPrint >= 70 warnt beim Import ohne HarfBuzz-Subset
      # (DeprecationWarning), unter ``filterwarnings = error`` stirbt damit
      # django.setup() beim pytest-Start (Stage-CI #137, v0.96.0). Zeile analog
      # test.yml; ``playwright install --with-deps`` bringt das Paket nicht mit.
      - run: sudo apt-get update && sudo apt-get install -y libharfbuzz-subset0
      - run: npm ci
      - run: npx @tailwindcss/cli -i src/static/css/input.css -o src/static/css/styles.css --minify
      - run: cd src && python manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: anlaufstelle.settings.e2e
          POSTGRES_HOST: localhost
          ENCRYPTION_KEY: P2N8yY4cVt1BmHZSvNrkSfkDYIJwEFcftRmO4bE-nZM=
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system deps only (cache hit)
        run: python -m playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # Protokolliert den Schnitt im Log: welche Scheibe wie viele Dateien und
      # Tests traegt. Macht eine schiefe Verteilung sichtbar, bevor jemand die
      # Laufzeiten der Jobs vergleicht.
      - name: Schnitt protokollieren
        run: python scripts/e2e_slice.py --slices "$E2E_SLICES" --summary
      # Seriell (kein -n 2): Die Projekt-Konvention ist "E2E seriell laufen" --
      # parallele Playwright-Laeufe auf ressourcenknappen Runnern sind instabil,
      # und das Release-Gate (make test-e2e) faehrt aus demselben Grund seriell.
      # Belegt bei v0.22.0: mit -n 2 auf 2 Kernen haengt der Passkey-Roundtrip
      # dauerhaft (Chromium stirbt unter CPU-Druck weg, danach dreht die
      # Playwright-Sync-API -- --timeout greift dort NICHT); seriell und auf
      # 8 Kernen laeuft derselbe Test gruen durch. Zusaetzlich fiel unter -n 2 ein
      # Locator-Race in test_file_vault auf. Beides Test-Defekte, nicht Produkt.
      # Die Matrix aendert daran nichts: jede Scheibe laeuft fuer sich seriell,
      # parallel sind nur die Jobs (Refs #1976).
      # --timeout-method=thread statt der Default-``signal``-Methode (Refs #1606):
      # Bei totem Chromium dreht die Playwright-Sync-API in einem Greenlet frei;
      # SIGALRM im Main-Thread greift dort nicht (v0.22.0 lief 28 min trotz
      # --timeout=120 durch). Die thread-Methode dumpt die Stacks aus einem
      # eigenen Timer-Thread und beendet den Prozess hart (os._exit) -- macht den
      # Hänger zum Fehlschlag. Der Job-Level ``timeout-minutes`` bleibt als
      # zweite Sicherung.
      # The emptiness check matters: ``pytest`` WITHOUT file arguments
      # collects the WHOLE suite -- a failed cut would otherwise run as a full
      # run in every slice, silently and into the timeout.
      - name: E2E-Scheibe ${{ matrix.slice }} ausfuehren
        run: |
          set -euo pipefail
          files=$(python scripts/e2e_slice.py --slices "$E2E_SLICES" --index "${{ matrix.slice }}")
          if [ -z "$files" ]; then
            echo "Leerer Schnitt fuer Scheibe ${{ matrix.slice }}/$E2E_SLICES." >&2
            exit 1
          fi
          python -m pytest $files -m "e2e" --timeout=120 --timeout-method=thread
        env:
          DJANGO_SETTINGS_MODULE: anlaufstelle.settings.e2e
          POSTGRES_HOST: localhost
          ENCRYPTION_KEY: P2N8yY4cVt1BmHZSvNrkSfkDYIJwEFcftRmO4bE-nZM=
