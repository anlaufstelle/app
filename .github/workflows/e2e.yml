name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    # Ohne dieses Limit laeuft ein haengender Job bis in GitHubs 6-Stunden-Default
    # (v0.22.0: 1h22m, bis er von Hand abgebrochen wurde) und brennt Actions-Minuten.
    # 45 statt 30: seriell braucht die Suite lokal 15-16 min auf 8 Kernen, auf einem
    # 2-Kern-Runner plus Setup eher ~25 -- das Limit soll Haenger abraeumen, nicht
    # langsame Laeufe abschneiden.
    # 45 min reichten bis v0.81.0, wurden mit v0.82.0 aber gerissen: der Lauf
    # kam bis 92 % und wurde vom Job-Timeout gekappt -- ohne einen einzigen
    # Testfehler. Groessenordnung: lokal seriell 22 min fuer 832 Tests, auf dem
    # Runner > 45 min fuer 92 % von 839. Der Faktor ist Runner-Hardware, nicht
    # Testcode: die Postgres-Service-Logs desselben Laufs zeigen Checkpoints mit
    # write=151 s (lokal Millisekunden), also gesaettigte Disk-I/O.
    # 90 min geben Luft fuer diese Varianz, ohne einen echten Haenger lange
    # laufen zu lassen -- den faengt weiterhin --timeout=120 pro Test ab.
    # Nachhaltiger waere eine Matrix ueber mehrere Scheiben (je seriell, wie
    # test-e2e-halves lokal); als eigenes Ticket vorgemerkt.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: anlaufstelle
          POSTGRES_USER: anlaufstelle
          POSTGRES_PASSWORD: anlaufstelle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anlaufstelle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx @tailwindcss/cli -i src/static/css/input.css -o src/static/css/styles.css --minify
      - run: cd src && python manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: anlaufstelle.settings.e2e
          POSTGRES_HOST: localhost
          ENCRYPTION_KEY: P2N8yY4cVt1BmHZSvNrkSfkDYIJwEFcftRmO4bE-nZM=
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system deps only (cache hit)
        run: python -m playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # Seriell (kein -n 2): Die Projekt-Konvention ist "E2E seriell laufen" --
      # parallele Playwright-Laeufe auf ressourcenknappen Runnern sind instabil,
      # und das Release-Gate (make test-e2e) faehrt aus demselben Grund seriell.
      # Belegt bei v0.22.0: mit -n 2 auf 2 Kernen haengt der Passkey-Roundtrip
      # dauerhaft (Chromium stirbt unter CPU-Druck weg, danach dreht die
      # Playwright-Sync-API -- --timeout greift dort NICHT); seriell und auf
      # 8 Kernen laeuft derselbe Test gruen durch. Zusaetzlich fiel unter -n 2 ein
      # Locator-Race in test_file_vault auf. Beides Test-Defekte, nicht Produkt.
      # --timeout-method=thread statt der Default-``signal``-Methode (Refs #1606):
      # Bei totem Chromium dreht die Playwright-Sync-API in einem Greenlet frei;
      # SIGALRM im Main-Thread greift dort nicht (v0.22.0 lief 28 min trotz
      # --timeout=120 durch). Die thread-Methode dumpt die Stacks aus einem
      # eigenen Timer-Thread und beendet den Prozess hart (os._exit) -- macht den
      # Hänger zum Fehlschlag. Der Job-Level ``timeout-minutes`` bleibt als
      # zweite Sicherung.
      - run: python -m pytest -m "e2e" --timeout=120 --timeout-method=thread
        env:
          DJANGO_SETTINGS_MODULE: anlaufstelle.settings.e2e
          POSTGRES_HOST: localhost
          ENCRYPTION_KEY: P2N8yY4cVt1BmHZSvNrkSfkDYIJwEFcftRmO4bE-nZM=
