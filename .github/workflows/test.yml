name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Ohne Limit läuft ein Hänger bis in GitHubs 6-Stunden-Default (Refs #1606).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: anlaufstelle
          POSTGRES_USER: anlaufstelle
          POSTGRES_PASSWORD: anlaufstelle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anlaufstelle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      # Refs #1933 / #1900: Die Katalog-Tests rufen echte GNU-gettext-Werkzeuge
      # auf — ``makemessages`` braucht ``msguniq``/``xgettext``,
      # ``scripts/i18n_catalog.py::_compile`` braucht ``msgfmt``. Ohne dieses
      # Paket ueberspringen sich die Tests still (``shutil.which``-Guard), das
      # Gate waere hier also stumm statt gruen. Zeile analog lint.yml
      # (``translations-coverage``).
      - run: sudo apt-get update && sudo apt-get install -y gettext
      # ``styles.css`` ist ein gitignoriertes Tailwind-Build-Artefakt (v4, #1480):
      # der Prod-Dockerfile baut es, die PWA-/APP_SHELL-Guards und der
      # collectstatic-Test brauchen es ebenfalls. Schritt analog zu e2e.yml.
      - run: npm ci
      - run: npx @tailwindcss/cli -i src/static/css/input.css -o src/static/css/styles.css --minify
      # Refs #922 / #923: Drift-Check vor den Tests. Faillt, wenn die
      # Manual-Test-Matrix Test-Files referenziert, die nicht existieren.
      - name: Verify manual-test-matrix drift
        run: python scripts/verify_test_matrix_drift.py
      # Refs #823 (C-56): --cov-fail-under erzwingt die Coverage-Schwelle.
      # Stand 2026-05-20 (#945/#949): 96 % erreicht durch gezielte
      # Top-Lücken-Tests (Buckets A+B+C+D). Folge-PRs dürfen den Wert anheben,
      # aber nicht senken.
      - run: python -m pytest -m "not e2e" --ignore=src/tests/e2e -n auto --cov=core --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=96
        env:
          POSTGRES_HOST: localhost
          ENCRYPTION_KEY: P2N8yY4cVt1BmHZSvNrkSfkDYIJwEFcftRmO4bE-nZM=
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: anlaufstelle
          POSTGRES_USER: anlaufstelle
          POSTGRES_PASSWORD: anlaufstelle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anlaufstelle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: cd src && python manage.py check --settings=anlaufstelle.settings.dev
        env:
          POSTGRES_HOST: localhost
      - run: cd src && python manage.py makemigrations --check --dry-run --settings=anlaufstelle.settings.dev
        env:
          POSTGRES_HOST: localhost
      - run: cd src && python manage.py check --deploy --settings=anlaufstelle.settings.prod
        env:
          POSTGRES_HOST: localhost
          DJANGO_SECRET_KEY: ci-check-only-not-a-real-secret-padpadpad
          ENCRYPTION_KEY: P2N8yY4cVt1BmHZSvNrkSfkDYIJwEFcftRmO4bE-nZM=
          DJANGO_AUDIT_HASH_KEY: ci-check-only-not-a-real-audit-hash-key
          ALLOWED_HOSTS: localhost
          # core.E002 (#1453) verlangt MEDIA_ROOT ausserhalb BASE_DIR,
          # core.W002 (#1661) ein gesetztes FILE_UPLOAD_TEMP_DIR — Dummies
          # analog docker-compose.prod.yml. Spiegel: release-gates.sh.
          MEDIA_ROOT: /tmp/ci-media
          FILE_UPLOAD_TEMP_DIR: /tmp

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - name: SBOM (CycloneDX) generieren
        run: pip-audit -r requirements.txt --format cyclonedx-json -o sbom.json
      - name: SBOM als Artefakt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90

  lock-check:
    # Stellt sicher, dass requirements*.txt (Lock-Files) synchron zu
    # requirements*.in sind. Schlägt fehl, wenn pip-compile Drift erkennt.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install pip-tools
      # Flags müssen exakt dem Makefile-Target `deps-lock` entsprechen (SSOT),
      # insb. --generate-hashes (Artefakt-Integrität, #1373) und --allow-unsafe
      # für die dev-Datei (pinnt pip/setuptools/wheel) — sonst meldet der Check
      # Phantom-Drift gegen die gehashten Lock-Files.
      - name: Verify requirements.txt is up to date
        run: |
          cp requirements.txt requirements.txt.bak
          pip-compile --generate-hashes --quiet --no-strip-extras --resolver=backtracking \
            --output-file=requirements.txt requirements.in
          if ! diff -u requirements.txt.bak requirements.txt; then
            echo "::error::requirements.txt ist nicht aktuell — 'make deps-lock' ausführen."
            exit 1
          fi
      - name: Verify requirements-dev.txt is up to date
        run: |
          cp requirements-dev.txt requirements-dev.txt.bak
          pip-compile --generate-hashes --allow-unsafe --quiet --no-strip-extras --resolver=backtracking \
            --output-file=requirements-dev.txt requirements-dev.in
          if ! diff -u requirements-dev.txt.bak requirements-dev.txt; then
            echo "::error::requirements-dev.txt ist nicht aktuell — 'make deps-lock' ausführen."
            exit 1
          fi
