name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # Moving label switches to Ubuntu 26 on 2026-10-19; upgrade deliberately after v0.99.8.
    # Without a limit a hang would run into GitHub's 6-hour default (Refs #1606).
    # 60 minutes: on the 2-vCPU runner of private repos the suite took about
    # 35 minutes up to v0.99.6 and 48-50 minutes for v0.99.7; the stage run on
    # f70c744f was cancelled at the former 50-minute limit without a failing
    # test. A real hang is bounded by the per-test ``--timeout`` below, not by
    # the job limit.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: anlaufstelle
          POSTGRES_USER: anlaufstelle
          POSTGRES_PASSWORD: anlaufstelle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anlaufstelle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      # Refs #1933 / #1900: Die Katalog-Tests rufen echte GNU-gettext-Werkzeuge
      # auf — ``makemessages`` braucht ``msguniq``/``xgettext``,
      # ``scripts/i18n_catalog.py::_compile`` braucht ``msgfmt``. Ohne dieses
      # Paket ueberspringen sich die Tests still (``shutil.which``-Guard), das
      # Gate waere hier also stumm statt gruen. Zeile analog lint.yml
      # (``translations-coverage``).
      # libharfbuzz-subset0: WeasyPrint >= 70 laedt HarfBuzz-Subset beim Import und
      # warnt (DeprecationWarning) ohne die Bibliothek — unter ``filterwarnings =
      # error`` stirbt damit django.setup() (Stage-CI #137, v0.96.0). Das
      # Runner-Image bringt das Paket nicht mit; kuenftige WeasyPrint-Versionen
      # setzen es voraus. Gleiche Zeile in e2e.yml, Paket auch im Dockerfile.
      - run: sudo apt-get update && sudo apt-get install -y gettext libharfbuzz-subset0
      # ``styles.css`` ist ein gitignoriertes Tailwind-Build-Artefakt (v4, #1480):
      # der Prod-Dockerfile baut es, die PWA-/APP_SHELL-Guards und der
      # collectstatic-Test brauchen es ebenfalls. Schritt analog zu e2e.yml.
      - run: npm ci
      - run: npx @tailwindcss/cli -i src/static/css/input.css -o src/static/css/styles.css --minify
      # Refs #922 / #923: Drift-Check vor den Tests. Faillt, wenn die
      # Manual-Test-Matrix Test-Files referenziert, die nicht existieren.
      - name: Verify manual-test-matrix drift
        run: python scripts/verify_test_matrix_drift.py
      # Refs #823 (C-56): --cov-fail-under erzwingt die Coverage-Schwelle.
      # Stand 2026-05-20 (#945/#949): 96 % erreicht durch gezielte
      # Top-Lücken-Tests (Buckets A+B+C+D). Folge-PRs dürfen den Wert anheben,
      # aber nicht senken.
      # Timeout je Test (Refs #2022): ein haengender Test soll mit Traceback und
      # Testnamen scheitern statt den Job stumm stehen zu lassen (thread-Methode
      # wie in e2e.yml, damit auch blockierende C-Aufrufe abgebrochen werden;
      # der langsamste Test liegt lokal bei ~15 s). --durations zeigt die
      # teuersten Tests, damit Runner-Kosten sichtbar bleiben.
      - run: python -m pytest -m "not e2e" --ignore=src/tests/e2e -n auto --dist worksteal --timeout=600 --timeout-method=thread --durations=30 --cov=core --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=96
        env:
          POSTGRES_HOST: localhost
          ENCRYPTION_KEY: P2N8yY4cVt1BmHZSvNrkSfkDYIJwEFcftRmO4bE-nZM=
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  check:
    runs-on: ubuntu-24.04  # Moving label switches to Ubuntu 26 on 2026-10-19; upgrade deliberately after v0.99.8.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: anlaufstelle
          POSTGRES_USER: anlaufstelle
          POSTGRES_PASSWORD: anlaufstelle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anlaufstelle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: cd src && python manage.py check --settings=anlaufstelle.settings.dev
        env:
          POSTGRES_HOST: localhost
      - run: cd src && python manage.py makemigrations --check --dry-run --settings=anlaufstelle.settings.dev
        env:
          POSTGRES_HOST: localhost
      - run: cd src && python manage.py check --deploy --settings=anlaufstelle.settings.prod
        env:
          POSTGRES_HOST: localhost
          DJANGO_SECRET_KEY: ci-check-only-not-a-real-secret-padpadpad
          ENCRYPTION_KEY: P2N8yY4cVt1BmHZSvNrkSfkDYIJwEFcftRmO4bE-nZM=
          DJANGO_AUDIT_HASH_KEY: ci-check-only-not-a-real-audit-hash-key
          ALLOWED_HOSTS: localhost
          # Refs #1967: localhost zaehlt bei der EXTERNAL_ORIGIN-Ableitung
          # nicht mit (Loopback dient nur dem Container-Healthcheck) — ohne
          # expliziten Dummy bricht der fail-closed-Guard in prod.py den
          # Check ab. Spiegel: release-gates.sh.
          EXTERNAL_ORIGIN: https://ci-check.invalid
          # core.E002 (#1453) verlangt MEDIA_ROOT ausserhalb BASE_DIR,
          # core.W002 (#1661) ein gesetztes FILE_UPLOAD_TEMP_DIR — Dummies
          # analog docker-compose.prod.yml. Spiegel: release-gates.sh.
          MEDIA_ROOT: /tmp/ci-media
          FILE_UPLOAD_TEMP_DIR: /tmp

  audit:
    runs-on: ubuntu-24.04  # Moving label switches to Ubuntu 26 on 2026-10-19; upgrade deliberately after v0.99.8.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      # pip-audit aus dem Dev-Lock ziehen, damit CI und Lock nicht driften (Refs #2063).
      - name: pip-audit aus dem Dev-Lock installieren
        run: |
          PA=$(grep -oE '^pip-audit==[0-9.]+' requirements-dev.txt)
          test -n "$PA" || { echo "::error::pip-audit-Pin nicht im Dev-Lock gefunden"; exit 1; }
          pip install "$PA"
      - run: pip-audit -r requirements.txt
      # JavaScript-Advisories (Refs #1968). ``npm audit`` liest nur
      # package-lock.json — kein ``npm ci`` noetig. Schwelle und Begruendung
      # spiegeln das ``audit-js``-Target im Makefile, das hier das
      # massgebliche Gate ist (dieser Workflow ruht ohne Actions-Guthaben).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
      - name: JavaScript-Advisories pruefen
        run: npm audit --audit-level=moderate
      - name: SBOM (CycloneDX) generieren
        run: pip-audit -r requirements.txt --format cyclonedx-json -o sbom.json
      - name: SBOM als Artefakt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90

  lock-check:
    # Stellt sicher, dass requirements*.txt (Lock-Files) synchron zu
    # requirements*.in sind. Schlägt fehl, wenn pip-compile Drift erkennt.
    runs-on: ubuntu-24.04  # Moving label switches to Ubuntu 26 on 2026-10-19; upgrade deliberately after v0.99.8.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      # pip-tools UND click exakt auf die Versionen des Dev-Locks pinnen (SSOT:
      # requirements-dev.txt). Ungepinnt zog der Schritt „latest“ — und click 8.5.0
      # änderte die ParameterSource-Klassifikation von Flag-Paar-Defaults, worauf
      # pip-tools 7.6.1 plötzlich `--no-index` in den Header schrieb und der
      # Byte-Vergleich gegen die mit dem Lock-Stand erzeugten Dateien scheiterte
      # (Stage-Run #129, v0.86.0). Die Pins wandern automatisch mit `make deps-lock` mit.
      - name: pip-tools + click aus dem Dev-Lock installieren
        run: |
          PT=$(grep -oE '^pip-tools==[0-9.]+' requirements-dev.txt)
          CK=$(grep -oE '^click==[0-9.]+' requirements-dev.txt)
          test -n "$PT" && test -n "$CK" || { echo "::error::pip-tools/click-Pin nicht im Dev-Lock gefunden"; exit 1; }
          pip install "$PT" "$CK"
      # Flags müssen exakt dem Makefile-Target `deps-lock` entsprechen (SSOT),
      # insb. --generate-hashes (Artefakt-Integrität, #1373) und --allow-unsafe
      # für die dev-Datei (pinnt pip/setuptools/wheel) — sonst meldet der Check
      # Phantom-Drift gegen die gehashten Lock-Files.
      - name: Verify requirements.txt is up to date
        run: |
          cp requirements.txt requirements.txt.bak
          pip-compile --generate-hashes --quiet --no-strip-extras --resolver=backtracking \
            --output-file=requirements.txt requirements.in
          if ! diff -u requirements.txt.bak requirements.txt; then
            echo "::error::requirements.txt ist nicht aktuell — 'make deps-lock' ausführen."
            exit 1
          fi
      - name: Verify requirements-dev.txt is up to date
        run: |
          cp requirements-dev.txt requirements-dev.txt.bak
          pip-compile --generate-hashes --allow-unsafe --quiet --no-strip-extras --resolver=backtracking \
            --output-file=requirements-dev.txt requirements-dev.in
          if ! diff -u requirements-dev.txt.bak requirements-dev.txt; then
            echo "::error::requirements-dev.txt ist nicht aktuell — 'make deps-lock' ausführen."
            exit 1
          fi
