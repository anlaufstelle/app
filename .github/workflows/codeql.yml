name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # CodeQL ist auf privaten Repos nur mit GitHub Advanced Security verfügbar.
    # Im Dev-Repo (anlaufstelle/app, privat) und im Stage-Repo
    # (anlaufstelle/stage, privat) wird der Job geskippt; im App-Repo
    # (anlaufstelle/app, public) läuft er kostenfrei und meldet Findings
    # ans Security-Tab. Refs Issue #687.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    # Ohne Limit laeuft ein Haenger bis in GitHubs 6-Stunden-Default (Refs #1606);
    # 30 statt 15, weil die CodeQL-Analyse (python + javascript) laenger braucht.
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: ${{ matrix.language }}
          # python + javascript sind interpretiert -> kein Build noetig; der
          # frühere autobuild-Step schlug daher fehl ("unable to build").
          build-mode: none
          queries: security-and-quality
      # Alle codeql-action-Steps MUESSEN auf dieselbe Version gepinnt sein
      # (Monorepo, gleiche SHA) -- gemischte Pins (init 4.36.3 / analyze 4.36.2)
      # brechen mit "config version X, running version Y". Kein autobuild-Step
      # bei build-mode: none.
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
