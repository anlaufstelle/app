name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # CodeQL ist auf privaten Repos nur mit GitHub Advanced Security verfügbar.
    # In the development repository (private) and the stage repository
    # (anlaufstelle/stage, private) the job is skipped; in the public
    # repository (anlaufstelle/app) it runs free of charge and reports findings
    # to the Security tab. Refs Issue #687.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    # Ohne Limit laeuft ein Haenger bis in GitHubs 6-Stunden-Default (Refs #1606);
    # 30 statt 15, weil die CodeQL-Analyse (python + javascript) laenger braucht.
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # python + javascript sind interpretiert -> kein Build noetig; der
          # frühere autobuild-Step schlug daher fehl ("unable to build").
          build-mode: none
          queries: security-and-quality
      # Alle codeql-action-Steps MUESSEN auf dieselbe Version gepinnt sein
      # (Monorepo, gleiche SHA) -- gemischte Pins (init 4.36.3 / analyze 4.36.2)
      # brechen mit "config version X, running version Y". Kein autobuild-Step
      # bei build-mode: none.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
