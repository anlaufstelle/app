name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Ohne Limit laeuft ein Haenger bis in GitHubs 6-Stunden-Default (Refs #1606);
    # 60, weil der arm64-Teil des Multi-Arch-Builds unter QEMU-Emulation langsam ist.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      # Refs #2064 / ADR-028: jeder v*-Tag baut und ueberschreibt :latest — ein
      # Tippfehler-Tag (v0.85, v0.9.0.1) darf das nicht. Fail-closed VOR dem Build.
      - name: Validate semver tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Tag '$REF_NAME' ist kein vX.Y.Z (ADR-028) — Release abgebrochen."
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up QEMU (für Multi-Arch-Emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: build
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          # Multi-Arch: amd64 (Server) + arm64 (Raspberry, Apple Silicon)
          platforms: linux/amd64,linux/arm64
          # GitHub Actions Cache spart Layer-Rebuilds zwischen Releases
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            DJANGO_SECRET_KEY=build-only-collectstatic
            APP_VERSION=${{ github.ref_name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the pushed image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      # Refs #886: GHCR-Pakete sind by-default privat, auch wenn das Source-Repo
      # public ist. Dieser Step setzt die Package-Visibility nach jedem Push
      # idempotent auf public — aber nur, wenn das Repo selbst public ist
      # (so läuft der Step im privaten Dev-Repo anlaufstelle/app nicht
      # versehentlich). Erfordert Repo-Secret GHCR_VISIBILITY_TOKEN
      # (PAT classic mit admin:packages-Scope; write:packages reicht nicht).
      - name: Ensure package visibility is public
        # The image and signature are already published when this final step
        # runs; a red step means only that package visibility still needs work.
        if: github.event.repository.private == false
        env:
          GH_TOKEN: ${{ secrets.GHCR_VISIBILITY_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GHCR_VISIBILITY_TOKEN is missing. The image and signature were published; set visibility to public manually in the package settings."
            exit 1
          fi
          ORG="${REPOSITORY%%/*}"
          PKG="${REPOSITORY##*/}"
          gh api -X PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${ORG}/packages/container/${PKG}" \
            -f visibility=public
