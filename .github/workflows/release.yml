name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Ohne Limit laeuft ein Haenger bis in GitHubs 6-Stunden-Default (Refs #1606);
    # 60, weil der arm64-Teil des Multi-Arch-Builds unter QEMU-Emulation langsam ist.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up QEMU (für Multi-Arch-Emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        id: build
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          # Multi-Arch: amd64 (Server) + arm64 (Raspberry, Apple Silicon)
          platforms: linux/amd64,linux/arm64
          # GitHub Actions Cache spart Layer-Rebuilds zwischen Releases
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            DJANGO_SECRET_KEY=build-only-collectstatic
            APP_VERSION=${{ github.ref_name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the pushed image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      # Refs #886: GHCR-Pakete sind by-default privat, auch wenn das Source-Repo
      # public ist. Dieser Step setzt die Package-Visibility nach jedem Push
      # idempotent auf public — aber nur, wenn das Repo selbst public ist
      # (so läuft der Step im privaten Dev-Repo anlaufstelle/app nicht
      # versehentlich). Erfordert Repo-Secret GHCR_VISIBILITY_TOKEN
      # (PAT classic mit admin:packages-Scope; write:packages reicht nicht).
      - name: Ensure package visibility is public
        # Optional: scheitert leise, wenn das Secret GHCR_VISIBILITY_TOKEN
        # noch nicht gesetzt ist (Refs #886). Image-Push selbst ist davon
        # unabhängig — Visibility kann manuell über die Package-Settings
        # geflippt werden, solange dieser Step nicht greift.
        continue-on-error: true
        if: github.event.repository.private == false
        env:
          GH_TOKEN: ${{ secrets.GHCR_VISIBILITY_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ORG="${REPOSITORY%%/*}"
          PKG="${REPOSITORY##*/}"
          gh api -X PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${ORG}/packages/container/${PKG}" \
            -f visibility=public
