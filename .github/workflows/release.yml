name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-24.04  # Moving label switches to Ubuntu 26 on 2026-10-19; upgrade deliberately after v0.99.8.
    # Ohne Limit laeuft ein Haenger bis in GitHubs 6-Stunden-Default (Refs #1606);
    # 60, weil der arm64-Teil des Multi-Arch-Builds unter QEMU-Emulation langsam ist.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      # Refs #2064 / ADR-028: jeder v*-Tag baut und ueberschreibt :latest — ein
      # Tippfehler-Tag (v0.85, v0.9.0.1) darf das nicht. Fail-closed VOR dem Build.
      - name: Validate semver tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Tag '$REF_NAME' ist kein vX.Y.Z (ADR-028) — Release abgebrochen."
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up QEMU (für Multi-Arch-Emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: build
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          # Multi-Arch: amd64 (Server) + arm64 (Raspberry, Apple Silicon)
          platforms: linux/amd64,linux/arm64
          # GitHub Actions Cache spart Layer-Rebuilds zwischen Releases
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The final stage runs apt-get upgrade; a cached layer would freeze the
          # Debian package state of an earlier build, so it is always rebuilt.
          no-cache-filters: final
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            DJANGO_SECRET_KEY=build-only-collectstatic
            APP_VERSION=${{ github.ref_name }}
      # Refs #2623: vulnerability gate before signing. Trivy (pinned by digest in
      # scripts/scan_images.py) scans the pushed image under its digest for
      # linux/amd64 and linux/arm64 plus the third-party images of
      # docker-compose.prod.yml. A blocking finding, a scanner, database or
      # registry error, or a missing Go detection for supercronic fails the job;
      # the image then stays unsigned. In the app image a finding at or above the
      # threshold blocks only with an available fix; one without a fix (no fixed
      # version and a no-fix status) is counted and listed as unfixed and does not
      # block, while an unclear fix status blocks.
      - name: Scan the image and the third-party images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: python3 scripts/scan_images.py --require-app-image --app-image "${IMAGE}@${DIGEST}" --out-dir image-scan
      - name: Upload the image scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-scan-${{ github.ref_name }}
          path: |
            image-scan/*.json
            image-scan/*.txt
          retention-days: 90
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the pushed image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      # Refs #886: a GHCR package is private when it is first created, even if the
      # source repository is public. GitHub's REST API cannot change package
      # visibility, so this step does not try to; it verifies the result instead:
      # an anonymous pull token must be able to read the manifest just pushed.
      # The image and signature are already published when this final step runs;
      # red means the package still has to be set to public once in its settings.
      - name: Verify the image is publicly pullable
        if: github.event.repository.private == false
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${REPOSITORY}:pull" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p') || token=""
          if [ -z "$token" ]; then
            echo "::error::No anonymous pull token from ghcr.io for ${REPOSITORY}; public pullability could not be verified."
            exit 1
          fi
          code=""
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/${REPOSITORY}/manifests/${REF_NAME}") || code="000"
            if [ "$code" = "200" ]; then
              echo "ghcr.io/${REPOSITORY}:${REF_NAME} is publicly pullable"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error::ghcr.io/${REPOSITORY}:${REF_NAME} is not publicly pullable (HTTP ${code}). The image and signature were published; set the package visibility to public in the package settings, then re-run this job."
          exit 1
