name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04  # Moving label switches to Ubuntu 26 on 2026-10-19; upgrade deliberately after v0.99.8.
    # Ohne Limit laeuft ein Haenger bis in GitHubs 6-Stunden-Default (Refs #1606).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      # Refs #819: Ruff-Version aus dem Lockfile ziehen, damit lokale
      # ``make lint`` und CI dieselbe Version nutzen.
      - run: pip install -r requirements-dev.txt
      - run: ruff check src/
      - run: ruff format --check src/

  licenses:
    # Refs #839: pip-licenses prueft jede installierte Dependency gegen die
    # AGPLv3-kompatible Allowlist in scripts/check_licenses.py.
    runs-on: ubuntu-24.04  # Moving label switches to Ubuntu 26 on 2026-10-19; upgrade deliberately after v0.99.8.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # Nur pip-licenses aus dem Dev-Lock ziehen; geprueft wird der Prod-Stack (Refs #2063).
      - name: pip-licenses aus dem Dev-Lock installieren
        run: |
          PL=$(grep -oE '^pip-licenses==[0-9.]+' requirements-dev.txt)
          test -n "$PL" || { echo "::error::pip-licenses-Pin nicht im Dev-Lock gefunden"; exit 1; }
          pip install "$PL"
      - run: python scripts/check_licenses.py
      - run: pip-licenses --format=markdown --with-system --with-urls > thirdparty-licenses.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: thirdparty-licenses
          path: thirdparty-licenses.md

  translation-versions:
    # Refs #832: EN-Translations duerfen nicht mehr als 2 Minor-Releases
    # hinter pyproject.toml zuruckliegen.
    runs-on: ubuntu-24.04  # Moving label switches to Ubuntu 26 on 2026-10-19; upgrade deliberately after v0.99.8.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: python scripts/check_translation_versions.py

  translations-coverage:
    # Refs #813 (C-46): Wachhund gegen fuzzy/untranslated-Regression in
    # de.po + en.po. Faellt wenn Werte oberhalb der Baseline klettern.
    runs-on: ubuntu-24.04  # Moving label switches to Ubuntu 26 on 2026-10-19; upgrade deliberately after v0.99.8.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gettext
        timeout-minutes: 5
      - run: python scripts/check_translations.py

  typecheck:
    # Refs #741 / #713 (Audit-Massnahme #37): mypy auf core/services
    # inkrementell. Eigener Job, damit lint + typecheck parallel laufen
    # und ein Type-Fehler die ruff-Resultate nicht versteckt.
    runs-on: ubuntu-24.04  # Moving label switches to Ubuntu 26 on 2026-10-19; upgrade deliberately after v0.99.8.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # mypy und django-stubs gemeinsam an den Dev-Lock binden (Refs #2063).
      - name: Typecheck-Werkzeuge aus dem Dev-Lock installieren
        run: |
          MY=$(grep -oE '^mypy==[0-9.]+' requirements-dev.txt)
          DS=$(grep -oE '^django-stubs\[compatible-mypy\]==[0-9.]+' requirements-dev.txt)
          test -n "$MY" && test -n "$DS" || { echo "::error::mypy/django-stubs-Pin nicht im Dev-Lock gefunden"; exit 1; }
          pip install "$MY" "$DS"
      - run: mypy src/core/services src/core/forms src/core/packages src/core/management/commands
