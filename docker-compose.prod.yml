# Produktions-Recreates mit Pflichtangaben verwenden beide Dateien:
# docker compose -f docker-compose.prod.yml -f compose.legal.yml up -d
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

name: anlaufstelle-prod

services:
  db:
    logging: *default-logging
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    # Container-Runtime-Hardening (Refs #1374): kein Privilege-Escalation,
    # cap_drop ALL. Postgres startet als root (chmod/chown Datadir + Socket,
    # dann Drop auf postgres), daher CHOWN/FOWNER/SETUID/SETGID zurueck
    # DAC_OVERRIDE ist noetig, damit root das BESTEHENDE PGDATA (mode 0700,
    # postgres-uid) beim Entrypoint-``find`` traversieren kann — ohne bricht
    # ein Redeploy auf vorhandenem Datadir mit "Permission denied" (ein
    # Fresh-Init-Volume verdeckt das). Kein read_only: Datadir
    # + Unix-Socket sind Schreibpfade.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    pids_limit: 512
    mem_limit: 2g
    # KEIN env_file: .env hier — der db-Container nutzt
    # POSTGRES_USER=postgres als Bootstrap-Superuser (Postgres-Image-
    # Convention). Der App-User (NOSUPERUSER, NOBYPASSRLS, DML-only, KEIN
    # Owner) und der Admin-User (NOSUPERUSER, BYPASSRLS, DB-/Objekt-Owner)
    # werden im Init-Script ``deploy/postgres-init/01-app-role.sh`` angelegt.
    # Die Runtime-/Owner-Trennung (A1.4, Refs #1026) haelt die Append-Only-
    # Trigger fuer die App-Rolle unabschaltbar. Refs #902 / ADR-005, ADR-017,
    # ADR-020.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_DB_USER: ${POSTGRES_ADMIN_USER}
      ADMIN_DB_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      REQUIRE_ADMIN_DB_ROLE: "true"
    volumes:
      # PG18-Image: PGDATA=/var/lib/postgresql/18/docker, VOLUME-Deklaration
      # /var/lib/postgresql — Mount aufs Elternverzeichnis, nicht .../data
      # (PG16-Layout), sonst landen die Daten in einem anonymen Volume.
      # Migrationspfad 16→18 (dump/restore + Rollback): docs/ops-runbook.md.
      # Refs #1039.
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  redis:
    logging: *default-logging
    # Shared cache for django-ratelimit + health-detail caching (Refs #795,
    # C-27). Replaces the DatabaseCache default, which stays as a fallback
    # (empty REDIS_URL, see the web service further below and
    # docs/ops-runbook.md § 5.4a) — deployments without Redis keep working.
    #
    # Warum Redis 8 und nicht das im Issue skizzierte ``redis:7-alpine``:
    # Redis 7.4 wechselte auf RSALv2/SSPL (nicht OSI-konform); erst Redis 8
    # steht wieder unter AGPLv3 und passt damit zur Lizenz dieses Projekts.
    # Digest-Pin analog zu den uebrigen Images (Refs #1373).
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # REINER Cache, KEINE Persistenz — daher auch kein Volume:
    #   --save ""        schaltet die RDB-Snapshots ab
    #   --appendonly no  schaltet das AOF ab
    # Begruendung: im Cache liegen ausschliesslich regenerierbare Daten
    # (Rate-Limit-Zaehler mit Minuten-/Stunden-TTL, 15s-Health-Details).
    # Persistenz waere hier ein Datenschutz-Minus statt eines Plus — sie
    # schriebe Rate-Limit-Schluessel (u.a. Client-IPs, User-IDs) unnoetig auf
    # die Platte, wo sie keine Retention erfasst. Ein Redis-Neustart kostet
    # nur einen kalten Cache; die Zaehler starten dann neu (fail-open ist
    # hier akzeptabel, weil der Login-Lockout zusaetzlich in der DB haengt).
    # maxmemory + allkeys-lru deckelt den Speicher hart, statt den Container
    # ins mem_limit-OOM laufen zu lassen.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      # Defense-in-Depth (Refs #2002): requirepass zusaetzlich zur Netzgrenze.
      # Einfaches ``-``: ein leer gesetztes REDIS_PASSWORD= schaltet die
      # Authentifizierung wirklich ab (``--requirepass ""`` startet sauber),
      # statt den Default wieder hereinzuholen — dieselbe Semantik wie bei
      # REDIS_URL unten und bei ``--save ""`` oben.
      - --requirepass
      - ${REDIS_PASSWORD-}
    # Container-Runtime-Hardening (Refs #1374). ``user: redis`` umgeht den
    # root+gosu-Pfad des offiziellen Entrypoints — damit kommt der Service
    # ohne SETUID/SETGID/CHOWN aus (anders als db/clamav) und laeuft mit
    # leerem Capability-Set. read_only: redis-server schreibt ohne Persistenz
    # nichts; /data (VOLUME-Deklaration des Images) wird als tmpfs
    # ueberdeckt, damit kein anonymes Volume entsteht.
    user: redis
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /data:mode=1777
    pids_limit: 128
    mem_limit: 512m
    # KEIN env_file: .env — Redis braucht keine App-/DB-/Krypto-Secrets
    # (Blast-Radius, analog caddy). KEIN ports: — der Cache ist nur im
    # internal-Netz erreichbar und darf nie am Host haengen. Die Netzgrenze
    # bleibt die erste Schranke; requirepass ist seit #2002 die zweite,
    # unabhaengige Schranke fuer Rate-Limit-Schluessel mit Client-IPs.
    # KEIN env_file (siehe oben) — nur diese EINE Variable, und nur, damit der
    # Healthcheck sich authentifizieren kann. Refs #2002.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  web:
    logging: *default-logging
    # Migrationen laufen NICHT im Entrypoint, sondern als separater One-Shot-Job
    # vor dem Rolling-Restart (``docker-migrate.sh``; Refs #802/C-34). Der
    # Entrypoint macht nur ``collectstatic`` + ``gunicorn``. Ablauf + Aufruf:
    # docs/ops-runbook.md §1.2.
    # Image-Tag via APP_VERSION parametrisieren (Refs #800), Fallback auf
    # den zuletzt gepinnten Release-Tag — Operator-Setups ohne explizite
    # .env bleiben reproduzierbar. APP_IMAGE_DIGEST bindet optional zusaetzlich
    # an den unveraenderlichen Digest (Refs #2061).
    # Release tags exist as images in the registry (including those marked as
    # pre-release); whether a tag can be pulled is shown by
    # ``docker manifest inspect ghcr.io/anlaufstelle/app:<tag>`` (exit code
    # 0 = published). The fallback without registry access is the local image
    # build, see Admin-Guide § 1 "Image lokal aus dem Dockerfile bauen"
    # (Refs #2308). ``web`` does not receive APP_VERSION from the .env: the
    # value of this variable only selects the image, /health/ shows the value
    # baked in at build time.
    image: ghcr.io/anlaufstelle/app:${APP_VERSION:-v0.99.8}${APP_IMAGE_DIGEST:-}
    # Container-Runtime-Hardening (Refs #1374): kein Privilege-Escalation,
    # cap_drop ALL (web laeuft als non-root appuser auf :8000, braucht keine
    # Caps). read_only-Root-FS mit definiertem Schreib-Scratch: /tmp
    # (Django-Upload-Tempfiles > 2,5 MB + Gunicorn-Worker-Heartbeat) und
    # /app/staticfiles (Entrypoint-collectstatic + WhiteNoise-Manifest);
    # MEDIA_ROOT liegt auf dem beschreibbaren media-Volume. FILE_UPLOAD_TEMP_DIR
    # unten pinnt Djangos Upload-Klartext-Puffer explizit auf dieses tmpfs
    # (RAM) statt sich auf den impliziten tempfile.gettempdir()-Fallback zu
    # verlassen (Refs #1661).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      # mode 1777: der non-root appuser (uid 1000) muss das
      # Entrypoint-collectstatic-Manifest unter read_only schreiben koennen
      # (Docker-Default-tmpfs waere root:0755 -> Permission denied). Refs #1374.
      - /app/staticfiles:mode=1777
      # Gunicorn legt seinen Control-Server-Socket unter $HOME/.gunicorn ab;
      # unter read_only sonst "Read-only file system". Refs #1374.
      - /home/appuser/.gunicorn:mode=1777
      # WeasyPrint/fontconfig legt beim ersten PDF-Render seinen Cache unter
      # $HOME/.cache ab; unter read_only sonst "no writable cache directory"
      # (Fehler-Logs + langsamer Render). Refs #1374.
      - /home/appuser/.cache:mode=1777
    pids_limit: 512
    mem_limit: 2g
    environment:
      # Refs #1962: explizite HTTP-Runtime-Allowlist. Die .env enthaelt auch
      # POSTGRES_ADMIN_PASSWORD und POSTGRES_BOOTSTRAP_PASSWORD und darf daher
      # nie komplett in den Web-Container gelangen.
      ANLAUFSTELLE_PROCESS_ROLE: runtime
      DJANGO_LOAD_DOTENV: "false"
      DJANGO_SETTINGS_MODULE: anlaufstelle.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_AUDIT_HASH_KEY: ${DJANGO_AUDIT_HASH_KEY}
      SOURCE_CODE_URL: ${SOURCE_CODE_URL:-https://github.com/anlaufstelle/app}
      PROJECT_WEBSITE_URL: ${PROJECT_WEBSITE_URL-https://anlaufstelle.app}
      SOURCE_CODE_VERSION: ${SOURCE_CODE_VERSION-}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT-}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY-}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      EXTERNAL_ORIGIN: ${EXTERNAL_ORIGIN-}
      EMAIL_HOST: ${EMAIL_HOST-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@anlaufstelle.app}
      MEDIA_ROOT: ${MEDIA_ROOT:-/media/media}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-15}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS-}
      SENTRY_DSN: ${SENTRY_DSN-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      DJANGO_INVITE_TOKEN_TIMEOUT: ${DJANGO_INVITE_TOKEN_TIMEOUT:-259200}
      DJANGO_PASSWORD_RESET_TIMEOUT: ${DJANGO_PASSWORD_RESET_TIMEOUT:-7200}
      DJANGO_HEALTH_DETAIL_TOKEN: ${DJANGO_HEALTH_DETAIL_TOKEN-}
      # Refs #2315: Ankerpfad ist ab Werk gesetzt und gehoert damit zur
      # dokumentierten Runtime-Allowlist. Geschrieben wird die Datei von
      # cron/maintenance advance the anchor; web can only read its separate volume.
      DJANGO_AUDIT_HWM_PATH: ${DJANGO_AUDIT_HWM_PATH:-/data/audit_hwm.json}
      AUDITLOG_SYSTEM_RETENTION_MONTHS: ${AUDITLOG_SYSTEM_RETENTION_MONTHS:-24}
      SUDO_MODE_TTL_SECONDS: ${SUDO_MODE_TTL_SECONDS:-900}
      # Refs #2470: the MFA role enforcement and the passkey relying party act
      # in the HTTP runtime. ``-`` instead of ``:-``: unset keeps the code
      # default, a deliberately empty role list stays empty (switches that
      # level off, see settings/_mfa_roles.py).
      MFA_ENFORCED_ROLES_IMMEDIATE: ${MFA_ENFORCED_ROLES_IMMEDIATE-super_admin,facility_admin}
      MFA_ENFORCED_ROLES_GRACE: ${MFA_ENFORCED_ROLES_GRACE-lead,staff,assistant}
      OTP_WEBAUTHN_RP_ID: ${OTP_WEBAUTHN_RP_ID-}
      OTP_WEBAUTHN_ALLOWED_ORIGINS: ${OTP_WEBAUTHN_ALLOWED_ORIGINS-}
      # Refs #2470: further settings the HTTP runtime reads (audit detail
      # strictness, session scan cap of a credential revocation, statement
      # timeout of report queries); defaults equal the code defaults.
      DJANGO_AUDIT_DETAIL_STRICT: ${DJANGO_AUDIT_DETAIL_STRICT:-true}
      OFFLINE_REVOCATION_SESSION_SCAN_LIMIT: ${OFFLINE_REVOCATION_SESSION_SCAN_LIMIT:-10000}
      REPORTING_BACKEND_STATEMENT_TIMEOUT_MS: ${REPORTING_BACKEND_STATEMENT_TIMEOUT_MS:-10000}
      MAINTENANCE_FLAG_FILE: ${MAINTENANCE_FLAG_FILE:-/media/anlaufstelle.maintenance}
      MAINTENANCE_ALLOW_IPS: ${MAINTENANCE_ALLOW_IPS-}
      MAINTENANCE_CACHE_TTL: ${MAINTENANCE_CACHE_TTL:-5}
      MAINTENANCE_RETRY_AFTER: ${MAINTENANCE_RETRY_AFTER:-600}
      FILE_VAULT_MAX_UPLOAD_BYTES: ${FILE_VAULT_MAX_UPLOAD_BYTES:-52428800}
      FILE_VAULT_MAX_UPLOAD_FILES: ${FILE_VAULT_MAX_UPLOAD_FILES:-20}
      FILE_VAULT_MAX_IMAGE_PIXELS: ${FILE_VAULT_MAX_IMAGE_PIXELS:-40000000}
      FILE_VAULT_MAX_ARCHIVE_BYTES: ${FILE_VAULT_MAX_ARCHIVE_BYTES:-209715200}
      FILE_VAULT_MAX_ARCHIVE_RATIO: ${FILE_VAULT_MAX_ARCHIVE_RATIO:-100}
      FILE_VAULT_MAX_ARCHIVE_ENTRIES: ${FILE_VAULT_MAX_ARCHIVE_ENTRIES:-10000}
      FILE_VAULT_DEFAULT_FACILITY_QUOTA_MB: ${FILE_VAULT_DEFAULT_FACILITY_QUOTA_MB:-2048}
      POSTGRES_HOST: db
      # Refs #1017: Stabiler App-Rollenname für check_db_roles — der Migrate-Job
      # (docker-migrate.sh) überschreibt POSTGRES_USER auf die Admin-Rolle; ohne
      # diese Variable prüfte das Rollen-Gate fälschlich die Admin- statt App-Rolle.
      POSTGRES_APP_USER: ${POSTGRES_USER}
      # Upload-Klartext-Puffer (> FILE_UPLOAD_MAX_MEMORY_SIZE) explizit auf das
      # /tmp-tmpfs (RAM) pinnen, statt sich auf Djangos impliziten
      # tempfile.gettempdir()-Fallback zu verlassen (Refs #1661).
      FILE_UPLOAD_TEMP_DIR: /tmp
      # Shared Cache (Refs #795): zeigt per Default auf den mitgelieferten
      # redis-Service unten. Wer stattdessen ein bereits vorhandenes,
      # externes Redis nutzt, setzt REDIS_URL in der .env — der Wert hier
      # ist nur der Fallback. Leert man REDIS_URL bewusst (REDIS_URL= in der
      # .env), faellt prod.py auf den DatabaseCache zurueck; dann kann der
      # redis-Service entfallen (docker compose up --scale redis=0).
      # Ohne REDIS_PASSWORD bleibt dieser Default byte-identisch. Mit Passwort
      # werden die Credentials eingebettet, wie RedisCache sie als LOCATION erwartet.
      REDIS_URL: ${REDIS_URL-redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/1}
      # Refs #1872: Ablage der Host-Backups im Container. Der Settings-Default
      # (BASE_DIR.parent/backups) existiert im read_only-Image nicht, deshalb
      # meldete der Prod-Stack dauerhaft "Kein Backup gefunden" — unabhaengig
      # davon, ob der Host-Cron laeuft. Muss identisch zum Mount-Ziel unten sein.
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      DJANGO_HEALTH_BACKUP_REQUIRED: ${DJANGO_HEALTH_BACKUP_REQUIRED:-true}
      # Refs #2119: Disk-Check ohne Messwert degradiert, abschaltbar per Schalter.
      DJANGO_HEALTH_DISK_REQUIRED: ${DJANGO_HEALTH_DISK_REQUIRED:-true}
    volumes:
      # Persistent writable media root: /media/media (Refs #720, #2527).
      # stillen Datenverlust bei docker compose pull && up -d.
      # Refs #720.
      - media:/media
      - audit-anchor:/data:ro
      # Refs #1872: Backup-Ablage von scripts/ops/backup.sh (Host, Default
      # <repo>/backups) read-only hereinreichen, damit die Health-Card unter
      # /system/ und last_backup_age_hours in /health/ das Backup-Alter sehen.
      # Read-only: die App darf Backups lesen, nie schreiben oder loeschen.
      - ${BACKUP_HOST_DIR:-./backups}:${BACKUP_DIR:-/backups}:ro
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Nur kritische App-Zustaende sperren caddy; degraded bleibt erreichbar.
      test: ["CMD-SHELL", "python -c \"import json, urllib.request; ok = json.load(urllib.request.urlopen('http://localhost:8000/health/'))['status'] != 'error'; raise SystemExit(0 if ok else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - internal
      - frontend

  maintenance:
    logging: *default-logging
    # Privilegierter, opt-in One-Shot-Pfad fuer Migrationen und Operator-
    # Kommandos (Refs #1962). Anders als ``web`` darf nur dieser Service die
    # vollstaendige .env und damit Admin-/Bootstrap-Zugangsdaten sehen.
    # Registry-Stand pruefen und lokaler Build-Pfad: siehe Kommentar beim
    # ``web``-Dienst weiter oben.
    image: ghcr.io/anlaufstelle/app:${APP_VERSION:-v0.99.8}${APP_IMAGE_DIGEST:-}
    profiles: ["maintenance"]
    entrypoint: ["python", "manage.py"]
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache:mode=1777
    pids_limit: 256
    mem_limit: 1g
    env_file: .env
    environment:
      MEDIA_ROOT: ${MEDIA_ROOT:-/media/media}
      MAINTENANCE_FLAG_FILE: ${MAINTENANCE_FLAG_FILE:-/media/anlaufstelle.maintenance}
      DJANGO_AUDIT_HWM_PATH: ${DJANGO_AUDIT_HWM_PATH:-/data/audit_hwm.json}
      AUDITLOG_SYSTEM_RETENTION_MONTHS: ${AUDITLOG_SYSTEM_RETENTION_MONTHS:-24}
      ANLAUFSTELLE_PROCESS_ROLE: maintenance
      DJANGO_LOAD_DOTENV: "false"
      DJANGO_SETTINGS_MODULE: anlaufstelle.settings.prod
      POSTGRES_HOST: db
      POSTGRES_APP_USER: ${POSTGRES_USER}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_BOOTSTRAP_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD}
      CLAMAV_HOST: clamav
      FILE_UPLOAD_TEMP_DIR: /tmp
      REDIS_URL: ${REDIS_URL-redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/1}
    volumes:
      - media:/media
      - audit-anchor:/data:rw
      - ${BACKUP_HOST_DIR:-./backups}:${BACKUP_DIR:-/backups}:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  cron:
    logging: *default-logging
    # Hintergrundjob-Scheduler (Refs #794, C-26). Vor diesem Sidecar musste
    # jede Installation die Jobs per Host-Crontab selbst einrichten — tat sie
    # das nicht, liefen Retention (DSGVO Art. 5 Abs. 1 lit. e), Breach-
    # Detection (Art. 33), Audit-Ketten-Verifikation, Snapshots und
    # Orphan-Cleanup **nie**, ohne jede Fehlermeldung. Der Sidecar macht sie
    # ab Werk aktiv. Job-Liste + Zeitplan: ./deploy/crontab, Doku:
    # docs/ops-runbook.md § 3.2.
    #
    # Note: on hosts where the host crontab from the runbook is already set
    # up, the jobs would otherwise run TWICE. Before the first start of this
    # service, remove the corresponding host entries
    # (except the backup, which stays on the host) — docs/ops-runbook.md § 3.3.
    # Registry-Stand pruefen und lokaler Build-Pfad: siehe Kommentar beim
    # ``web``-Dienst weiter oben.
    image: ghcr.io/anlaufstelle/app:${APP_VERSION:-v0.99.8}${APP_IMAGE_DIGEST:-}
    # Der Image-Entrypoint faehrt collectstatic + gunicorn hoch; hier soll
    # stattdessen nur supercronic laufen (im Image unter /usr/local/bin,
    # sha256-gepinnt gebaut — siehe Dockerfile).
    entrypoint: ["/usr/local/bin/supercronic"]
    command: ["-passthrough-logs", "/etc/anlaufstelle/crontab"]
    # Container-Runtime-Hardening wie web (Refs #1374): non-root appuser,
    # keine Caps, read_only-Root-FS. KEIN /app/staticfiles-tmpfs — anders als
    # web laeuft hier kein Entrypoint-collectstatic, ein tmpfs wuerde das im
    # Image gebackene Manifest verdecken und {% static %} in Templates
    # (z.B. Breach-Benachrichtigungen) brechen.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      # WeasyPrint/fontconfig-Cache, falls ein Job PDF rendert.
      - /home/appuser/.cache:mode=1777
    pids_limit: 256
    mem_limit: 1g
    env_file: .env
    environment:
      MEDIA_ROOT: ${MEDIA_ROOT:-/media/media}
      MAINTENANCE_FLAG_FILE: ${MAINTENANCE_FLAG_FILE:-/media/anlaufstelle.maintenance}
      DJANGO_AUDIT_HWM_PATH: ${DJANGO_AUDIT_HWM_PATH:-/data/audit_hwm.json}
      AUDITLOG_SYSTEM_RETENTION_MONTHS: ${AUDITLOG_SYSTEM_RETENTION_MONTHS:-24}
      ANLAUFSTELLE_PROCESS_ROLE: maintenance
      DJANGO_LOAD_DOTENV: "false"
      DJANGO_SETTINGS_MODULE: anlaufstelle.settings.prod
      POSTGRES_HOST: db
      CLAMAV_HOST: clamav
      FILE_UPLOAD_TEMP_DIR: /tmp
      REDIS_URL: ${REDIS_URL-redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/1}
      POSTGRES_APP_USER: ${POSTGRES_USER}
      # Alle Jobs hier laufen als Admin-DB-Rolle (BYPASSRLS) — NICHT als die
      # RLS-gefilterte App-Rolle aus der .env. Ausserhalb eines HTTP-Requests
      # ist keine ``app.current_facility_id``-GUC gesetzt; als App-Rolle
      # brechen enforce_retention / verify_audit_chain /
      # cleanup_orphan_storage_files fail-loud ab (Refs #1016 A1.1), und ein
      # Lauf ohne Guard saehe 0 Zeilen und meldete faelschlich Erfolg. Genau
      # dieselbe Rollen-Umschaltung macht der Dev-Pfad in
      # dev-ops/deploy/run-as-admin.sh und der Migrate-Job (Refs #863).
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      # Zeitzone der Schedules. Ohne TZ liefe der Container in UTC und
      # "03:00" waere je nach Jahreszeit 04:00/05:00 Ortszeit. Default passt
      # zu settings.TIME_ZONE (Europe/Berlin); per .env ueberschreibbar.
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Job-Definitionen read-only aus dem Repo (analog Caddyfile/postgres-init).
      - ./deploy/crontab:/etc/anlaufstelle/crontab:ro
      # MEDIA_ROOT: cleanup_orphan_storage_files und enforce_retention
      # loeschen Anhaenge — dieselbe Volume-Sicht wie web.
      - media:/media
      - audit-anchor:/data:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Der Image-Healthcheck prueft den Webserver, den dieser Sidecar nicht
    # startet. Deshalb explizit deaktivieren; die Job-Wirksamkeit zeigen die
    # Marker im Compliance-Dashboard.
    healthcheck:
      disable: true
    # Bewusst KEIN ports: supercronic hat keinen
    # Endpunkt. Ob die Jobs wirklich laufen, zeigt das Compliance-Dashboard
    # (/system/compliance/, Kategorie „Hintergrundjobs") bzw. ``stale_jobs``
    # im /health/-Payload — beide lesen die Cron-Marker aus dem AuditLog
    # (Refs #919/#1335) und sind damit ein echter Wirksamkeits-Nachweis
    # statt eines blossen Prozess-Liveness-Checks.
    restart: unless-stopped
    networks:
      - internal

  clamav:
    logging: *default-logging
    image: clamav/clamav:stable@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    # Container-Runtime-Hardening (Refs #1374): kein Privilege-Escalation,
    # cap_drop ALL. clamav startet als root und dropt auf den clamav-User;
    # CHOWN/FOWNER/SETUID/SETGID + DAC_OVERRIDE zurueck (ohne DAC_OVERRIDE
    # scheitert das Oeffnen von /var/log/clamav/*.log -> Init-Fehler, empirisch
    # belegt). Kein read_only: freshclam schreibt Signatur-Updates.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    pids_limit: 512
    mem_limit: 3g
    volumes:
      - clamav-db:/var/lib/clamav
    # Refs #1006: Scan-Pfad-Vertrag. Die App scannt über pyclamd
    # ClamdNetworkSocket per TCP (CLAMAV_HOST:CLAMAV_PORT, Default
    # clamav:3310, siehe core/services/file_vault/virus_scan.py). Das
    # offizielle clamav/clamav:stable-Image aktiviert in seiner gebündelten
    # clamd.conf "TCPSocket 3310" by Default — clamd lauscht also auf
    # 0.0.0.0:3310. expose macht diesen internen Vertrag explizit/gepinnt.
    expose:
      - "3310"
    # Refs #938: Healthcheck via clamdscan --version (Smoke-Test des Binary)
    # statt clamdcheck.sh — robust gegen die lange Signatur-Lade-Phase
    # (start_period), in der ein Socket-Probe sonst transient unhealthy meldet.
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    restart: unless-stopped
    networks:
      - internal
      # freshclam braucht DNS/HTTPS-Egress fuer automatische Signaturupdates.
      # Das getrennte Netz verbindet keinen weiteren App-Service.
      - clamav-egress

  caddy:
    logging: *default-logging
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    # Container-Runtime-Hardening (Refs #1374): kein Privilege-Escalation,
    # cap_drop ALL bis auf NET_BIND_SERVICE (Bind auf 80/443; das Caddy-Binary
    # traegt cap_net_bind_service als File-Cap, die no-new-privileges sonst
    # beim exec blockt). read_only-Root-FS; beschreibbar via Volumes bleiben
    # /data, /config (Zertifikate/State) und /var/log/caddy (Zugriffs- und
    # Fehler-Log, Refs #1963).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      # Caddys interne PKI/CA schreibt Truststore-Tempfiles nach /tmp; unter
      # read_only sonst "read-only file system". Refs #1374.
      - /tmp
    pids_limit: 256
    mem_limit: 512m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Zugriffs- und Fehler-Log persistent — Refs #801, #1963.
      - caddy_logs:/var/log/caddy
    # KEIN env_file: .env hier — Caddy braucht keine App-/DB-/Krypto-Secrets
    # (Blast-Radius). Nur die vom Caddyfile tatsaechlich referenzierten
    # Variablen als Passthrough (DOMAIN, X_ROBOTS_TAG); leer/undefiniert
    # bleibt unset, damit Caddys eigener `{$X_ROBOTS_TAG:default}` greift.
    # Refs #1370.
    environment:
      - DOMAIN
      - X_ROBOTS_TAG
      # Vertraute Proxy-Bereiche fuer 'trusted_proxies static' im Caddyfile.
      # Dieselbe Variable liest settings.TRUSTED_PROXY_CIDRS — leer/undefiniert
      # heisst 'kein vorgelagerter Proxy' und ist der Regelfall. Refs #1963.
      - TRUSTED_PROXY_CIDRS
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend

volumes:
  audit-anchor:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
  clamav-db:
  media:

networks:
  internal:
    internal: true
  frontend:
  clamav-egress:
    internal: false
